<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chanh Có Gu</title><meta name="description" content="Chanh tuy chua nhưng gu thì không chua"><style>
:root{color-scheme:light dark;--nen:#fff;--chu:#111;--phu:#6b6b6b;--vien:#e8e8e8}
@media(prefers-color-scheme:dark){:root{--nen:#0f0f0f;--chu:#f2f2f2;--phu:#9a9a9a;--vien:#272727}}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu);-webkit-font-smoothing:antialiased;
font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1rem 3rem}
header{text-align:center;margin-bottom:1.4rem}
img{display:block}
.ava{width:4.5rem;height:4.5rem;border-radius:999px;object-fit:cover;margin:0 auto .6rem}
h1{font-size:1.15rem;margin:0 0 .25rem;letter-spacing:-.01em}
header p{margin:0;color:var(--phu);font-size:.85rem}
.xh{display:flex;gap:.5rem;justify-content:center;margin-top:.9rem}
.xh a{font-size:.78rem;padding:.42rem .85rem;border:1px solid var(--vien);
border-radius:999px;text-decoration:none;color:var(--chu)}
a.the{display:block;text-decoration:none;transition:transform .12s ease}
a.the:active{transform:scale(.985)}
a.the img,a.the .trong{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover}
a.the .trong{background:var(--vien)}
.trong-hoan{text-align:center;color:var(--phu);font-size:.9rem}
footer{margin-top:2.5rem;text-align:center;color:var(--phu);font-size:.72rem}

a.the{position:relative;color:#fff}
a.the .mo{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
a.the b{display:-webkit-box;font-weight:600;line-height:1.3;
-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.luoi{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
a.the .mo{padding:1.6rem .55rem .55rem}
a.the b{font-size:.76rem}
</style></head><body><main><header><h1>Chanh Có Gu</h1><p>Chanh tuy chua nhưng gu thì không chua</p></header><p class="trong-hoan">Chưa có sản phẩm nào.</p><footer>Tiếp thị liên kết</footer></main></body></html>
